name: good_jobs_digest — tests

on:
  push:
    branches: [main, master]
    paths:
      - "good_jobs_digest/**"
      - ".github/workflows/good-jobs-digest-tests.yml"
  pull_request:
    paths:
      - "good_jobs_digest/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: good_jobs_digest

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: good_jobs_digest/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # BQ off and no API key: the suite must pass without credentials.
        env:
          BQ_ENABLED: "false"
        run: pytest -q
